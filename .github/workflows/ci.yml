name: 🧹 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: 🔎 statix + deadnix
        run: nix build .#checks.x86_64-linux.lint --no-link -L

      - name: 🧪 Template evaluation (all templates)
        run: nix build .#checks.x86_64-linux.template-eval --no-link -L

  vm-tests:
    name: 🖥️ VM tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # The action grants the runner access to /dev/kvm before installing Nix
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm uid-range

      - name: 🧪 NixOS VM tests
        run: >-
          nix build --no-link -L
          .#checks.x86_64-linux.firewall
          .#checks.x86_64-linux.ssh-hardening
          .#checks.x86_64-linux.container-engine
